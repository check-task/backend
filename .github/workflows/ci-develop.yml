name: CI/CD - Pull Request

on:
  pull_request:
    branches:
      - develop
  push:
   branches:
    - develop

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
        
      - name: 의존성 설치
        run: npm ci

      - name: Prisma Client 생성
        run: npm run prisma:generate
        env: 
          DATABASE_URL: "mysql://user:pass@localhost:3306/dummy"

  deploy-test:
    needs: ci
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to Test Server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          TEST_ENV: ${{ secrets.TEST_BACKEND_ENV }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          echo "$TEST_ENV" > /tmp/.env.test

          scp -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            /tmp/.env.test \
            $EC2_USER@$EC2_HOST:/home/ubuntu/backend-test/.env

          ssh -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            $EC2_USER@$EC2_HOST << 'EOF'
            set -e
            
            # 테스트 서버 디렉토리
            cd /home/ubuntu/backend-test

            git pull origin develop  # develop 브랜치 pull

            npm ci
            npx prisma migrate deploy

            # pm2 앱 이름을 'backend-test'로 구분
            if pm2 describe backend-test > /dev/null 2>&1; then
              pm2 reload backend-test --update-env
            else
              # 포트를 운영과 다르게 설정
              PORT=8080 pm2 start src/index.js --name backend-test
            fi
            pm2 status
          EOF