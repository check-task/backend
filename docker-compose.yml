services:
  check-task-postgres:
    image: postgres:18-alpine
    container_name: check-task-postgres
    environment:
      POSTGRES_USER: check_task_user
      POSTGRES_PASSWORD: check_task_password
      POSTGRES_DB: check_task_db
    ports:
      - '5435:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U check_task_user -d check_task_db']
      interval: 5s
      timeout: 5s
      retries: 5

  check-task-redis:
    image: redis:7-alpine
    container_name: check-task-redis
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data: